<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lee BIM Documents – Procore Test</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; background:#f4f6f8; color:#1d2733; margin:0; padding:40px 16px; }
  .card { max-width:560px; margin:auto; background:#fff; border-radius:10px; padding:32px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { margin:0 0 8px; font-size:24px; }
  .ok { display:inline-block; background:#1f8a4c; color:#fff; padding:6px 12px; border-radius:20px; font-weight:600; margin-bottom:20px; }
  .warn { background:#c77700; }
  td { padding:6px 10px; border-bottom:1px solid #e5e8eb; font-size:14px; }
  td:first-child { color:#6b7785; }
</style>
</head>
<body>
<div class="card">
  <div id="badge" class="ok">✔ Page loaded</div>
  <h1>Lee BIM Documents</h1>
  <p>Test page. If you can see this inside Procore, the connection works.</p>
  <table>
    <tr><td>Running inside Procore?</td><td id="inside"></td></tr>
    <tr><td>Loaded at</td><td id="time"></td></tr>
    <tr><td>Info passed from Procore</td><td id="params"></td></tr>
  </table>
</div>
<script>
  var inside = window.self !== window.top;
  document.getElementById('inside').textContent = inside ? 'YES – embedded in Procore' : 'No – opened directly';
  if (!inside) { var b = document.getElementById('badge'); b.className = 'ok warn'; b.textContent = 'Page loaded (not inside Procore yet)'; }
  document.getElementById('time').textContent = new Date().toLocaleString();
  var p = new URLSearchParams(location.search), out = [];
  p.forEach(function (v, k) { out.push(k + ' = ' + v); });
  document.getElementById('params').textContent = out.length ? out.join(', ') : 'none';
</script>
</body>
</html>
